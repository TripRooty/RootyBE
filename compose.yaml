services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"   # host:container
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data   # 선택(권장): 데이터 영속화
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always
volumes:
  pgdata:
